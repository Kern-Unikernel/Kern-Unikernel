# action.yml
name: 'kern'
description: 'Build, sign and push applications as unikernels using kern'
author: 'Kern-Unikernel'

inputs:
  runtime:
    description: 'Runtime to use (node, go, rust, python)'
    required: false
    default: 'auto'
  push:
    description: 'Registry to push the image (e.g. ghcr.io/user/app:1.0.0)'
    required: false
    default: ''
  registry-user:
    description: 'Registry username'
    required: false
    default: ''
  registry-token:
    description: 'Registry token or password'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the app'
    required: false
    default: '.'

outputs:
  image-path:
    description: 'Path to the built .uki image'
    value: ${{ steps.build.outputs.image-path }}

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          qemu-system-x86 qemu-kvm \
          binutils skopeo buildah \
          iproute2 bridge-utils
        if ! command -v go &>/dev/null; then
          curl -fsSL https://go.dev/dl/go1.22.4.linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local
          echo "/usr/local/go/bin" >> $GITHUB_PATH
        fi

    - name: Install kern
      shell: bash
      run: |
        git clone https://github.com/Kern-Unikernel/Kern-Unikernel.git /tmp/kern-src
        cd /tmp/kern-src
        go build -o kern ./cmd/
        sudo mv kern /usr/local/bin/kern
        sudo mkdir -p /usr/local/bin/profiles
        sudo cp profiles/*.toml /usr/local/bin/profiles/
        echo "kern installed: $(kern --help | head -1)"

    - name: Build unikernel
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        kern build
        echo "image-path=$(pwd)/.unikernel/image.uki" >> $GITHUB_OUTPUT

    - name: Verify image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: kern verify

    - name: Push image
      if: inputs.push != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        kern push ${{ inputs.push }} \
          -u ${{ inputs.registry-user }} \
          -p ${{ inputs.registry-token }}
