name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Verificar formato
        run: |
          if [ "$(gofmt -l .)" != "" ]; then
            echo "❌ Código sin formatear:"
            gofmt -l .
            exit 1
          fi
          echo "✅ Formato correcto"

      - name: Compilar
        run: go build -o /dev/null ./...

      - name: Tests
        run: go test ./... -v -timeout 60s
